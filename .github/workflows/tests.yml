name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        suite: [macarena, ensemble]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TRIFECTA_CONFIG_DIR: ${{ github.workspace }}/configuration
      TRIFECTA_LOG_DIR: ${{ github.workspace }}/log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test ${{ matrix.suite }}
        run: dotnet test test/${{ matrix.suite }}/Trifecta.${{ matrix.suite == 'macarena' && 'Macarena' || 'Ensemble' }}.Tests.csproj --nologo --logger "console;verbosity=normal"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.suite }}
          path: log
          if-no-files-found: ignore
